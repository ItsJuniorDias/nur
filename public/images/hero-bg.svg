<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6d6"/>
      <stop offset="100%" stop-color="#e7dac6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#10614a" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="2400" height="1350" fill="url(#bg)"/>
  <rect width="2400" height="1350" fill="url(#dots)"/>

  <!-- Safe zone rectangle (visual only) -->
  <rect x="480" y="270" width="1440" height="810"
        fill="none" stroke="#10614a" stroke-width="2"
        stroke-dasharray="12 8" opacity="0.5"/>

  <!-- Safe zone label -->
  <text x="500" y="305"
        font-family="Inter, sans-serif" font-size="29"
        fill="#10614a" opacity="0.7"
        letter-spacing="4">SAFE · CENTER</text>

  <!-- Main label -->
  <text x="1200" y="655"
        font-family="Inter, sans-serif" font-size="81"
        font-weight="200" fill="#14261f"
        text-anchor="middle"
        letter-spacing="8">HERO BACKGROUND</text>

  <!-- Dimensions -->
  <text x="1200" y="756"
        font-family="Inter, sans-serif" font-size="37"
        font-weight="300" fill="#14261f" opacity="0.5"
        text-anchor="middle"
        letter-spacing="6">2400 × 1350</text>

  <!-- NUR mark bottom-right corner -->
  <text x="2360" y="1310"
        font-family="Inter, sans-serif" font-size="29"
        font-weight="300" fill="#14261f" opacity="0.4"
        text-anchor="end"
        letter-spacing="6">NŪR · PLACEHOLDER</text>
</svg>