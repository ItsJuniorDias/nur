<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1280" width="1024" height="1280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a14"/>
      <stop offset="100%" stop-color="#0f2a20"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#3fae86" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1024" height="1280" fill="url(#bg)"/>
  <rect width="1024" height="1280" fill="url(#dots)"/>

  <!-- Safe zone rectangle (visual only) -->
  <rect x="512" y="128" width="460" height="1024"
        fill="none" stroke="#3fae86" stroke-width="2"
        stroke-dasharray="12 8" opacity="0.5"/>

  <!-- Safe zone label -->
  <text x="532" y="163"
        font-family="Inter, sans-serif" font-size="22"
        fill="#3fae86" opacity="0.7"
        letter-spacing="4">SAFE · RIGHT</text>

  <!-- Main label -->
  <text x="512" y="620"
        font-family="Inter, sans-serif" font-size="61"
        font-weight="200" fill="#f0e6d6"
        text-anchor="middle"
        letter-spacing="8">MANIFESTO</text>

  <!-- Dimensions -->
  <text x="512" y="701"
        font-family="Inter, sans-serif" font-size="28"
        font-weight="300" fill="#f0e6d6" opacity="0.5"
        text-anchor="middle"
        letter-spacing="6">1024 × 1280</text>

  <!-- NUR mark bottom-right corner -->
  <text x="984" y="1240"
        font-family="Inter, sans-serif" font-size="22"
        font-weight="300" fill="#f0e6d6" opacity="0.4"
        text-anchor="end"
        letter-spacing="6">NŪR · PLACEHOLDER</text>
</svg>