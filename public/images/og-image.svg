<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0e6d6"/>
      <stop offset="100%" stop-color="#e7dac6"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#10614a" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Safe zone rectangle (visual only) -->
  <rect x="240" y="126" width="720" height="378"
        fill="none" stroke="#10614a" stroke-width="2"
        stroke-dasharray="12 8" opacity="0.5"/>

  <!-- Safe zone label -->
  <text x="260" y="161"
        font-family="Inter, sans-serif" font-size="13"
        fill="#10614a" opacity="0.7"
        letter-spacing="4">SAFE · CENTER</text>

  <!-- Main label -->
  <text x="600" y="295"
        font-family="Inter, sans-serif" font-size="37"
        font-weight="200" fill="#14261f"
        text-anchor="middle"
        letter-spacing="8">NŪR</text>

  <!-- Dimensions -->
  <text x="600" y="352"
        font-family="Inter, sans-serif" font-size="17"
        font-weight="300" fill="#14261f" opacity="0.5"
        text-anchor="middle"
        letter-spacing="6">1200 × 630</text>

  <!-- NUR mark bottom-right corner -->
  <text x="1160" y="590"
        font-family="Inter, sans-serif" font-size="13"
        font-weight="300" fill="#14261f" opacity="0.4"
        text-anchor="end"
        letter-spacing="6">NŪR · PLACEHOLDER</text>
</svg>